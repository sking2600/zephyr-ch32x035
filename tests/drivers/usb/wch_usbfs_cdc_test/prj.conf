CONFIG_STDOUT_CONSOLE=y
CONFIG_SDI_CONSOLE=y
CONFIG_GPIO=y
CONFIG_LOG=y
CONFIG_CLOCK_CONTROL=y

# New USB Device Stack
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_CDC_ACM_CLASS=y

# Serial over CDC ACM helper
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=y
CONFIG_CDC_ACM_SERIAL_ENABLE_AT_BOOT=y

# Params
CONFIG_CDC_ACM_SERIAL_VID=0x1a86
CONFIG_CDC_ACM_SERIAL_PID=0x7523
CONFIG_CDC_ACM_SERIAL_MANUFACTURER_STRING="Zephyr"
CONFIG_CDC_ACM_SERIAL_PRODUCT_STRING="UDC Test"

# Debug
CONFIG_UDC_DRIVER_LOG_LEVEL_DBG=y
CONFIG_COMPILER_WARNINGS_AS_ERRORS=n
CONFIG_USB_DEVICE_DRIVER=n
CONFIG_LTO=y
CONFIG_ISR_TABLES_LOCAL_DECLARATION=y
