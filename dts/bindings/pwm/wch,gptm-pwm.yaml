description: WCH General-purpose Timer (GPTM) for PWM

compatible: "wch,gptm-pwm"

include: [base.yaml, pwm-controller.yaml, pinctrl-device.yaml]

properties:
  "#pwm-cells":
    const: 3

  prescaler:
    type: int
    required: true
    description: Clock prescaler value for the timer

  wch,repetition-counter:
    type: int
    description: |
      Repetition counter value (0-255).
      Only applies to advanced timers (TIM1).
      Defines the number of intermediate overflow/underflow events before an update event is generated.
      Equation -> Update_Event_Rate = (Event_Rate) / (RPTCR + 1)

pwm-cells:
  - channel
  - period
  - flags
