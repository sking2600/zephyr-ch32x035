description: WCH General-purpose Timer (GPTM) for PWM

compatible: "wch,gptm-pwm"

include: [base.yaml, pwm-controller.yaml, pinctrl-device.yaml]

properties:
  "#pwm-cells":
    const: 3

  prescaler:
    type: int
    required: true
    description: Clock prescaler value for the timer

pwm-cells:
  - channel
  - period
  - flags
