description: WCH PWR (Power Control)

compatible: "wch,pwr"

include: base.yaml

properties:
  reg:
    required: true

  interrupts:
    required: false

  clocks:
    required: false

  pvd-level:
    type: int
    required: false
    description: |
      Programmable Voltage Detector (PVD) threshold level.
      Refer to specific SoC documentation for level-to-voltage mapping.
      Usually 0-7 or 0-3 depending on family.
